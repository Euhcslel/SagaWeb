syntax = "proto3";

package proto;
option go_package = "../project/internal/generated";

message GateConfig {
  GateType gate_type = 1;
  int32 width = 2;
  int32 height = 3;
  int64 lift_type_id = 4;
  int64 color_out_id = 5;
  Drive drive = 6;
  int64 cycle_amount_id = 7;
  repeated Option options = 8;
  int32 headroom = 9;
  int32 amount = 10;
}

message Option {
  int64 option_id = 1;
  int32 amount = 2;
}

enum GateType {
  GATE_TYPE_IND = 0;
  GATE_TYPE_RES = 1;
}

message Drive {
  oneof drive_type {
    IndustrialDrive industrial = 1;
    ResidentialDrive residential = 2;
    ManualDrive manual = 3;
  }
}

message IndustrialDrive {
  int64 drive_id = 1;
}

message ResidentialDrive {
  int64 drive_id = 1;
  int64 rail_id = 2;
}

message ManualDrive {
  int32 chain_length = 1;
}

message OrderRequest {
  repeated GateConfig order_gates = 1;
  repeated Product products = 2;
}

message Product {
  int64 product_id = 1;
  int32 amount = 2;
}

message UpdateProductsRequest {
  repeated Product products = 1;
}
