<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/web/assets/images/favicon.ico" />
    <link rel="stylesheet" href="/web/assets/styles/library/index.css" />
    {{if .css}}
    <link rel="stylesheet" href="/web/assets/styles/pages/{{.css}}" />
    {{end}}
    <title>Ворота №{{.gate.RowNumber}}</title>
    <script>
      const gateConfiguration = {
        gateType: {{.gate.GateType}},
        width: {{.gate.Width}},
        height: {{.gate.Height}},
        headroom: {{.gate.Headroom}},
        liftTypeID: {{.gate.LiftTypeID}},
        colorOutID: {{.gate.ColorOutID}},
        cycleAmountID: {{.gate.CycleAmountID}},
        driveType: {{.gate.DriveType}},
        amount: {{.gate.Amount}}
      }
    </script>
    <script
      type="module"
      src="/web/assets/scripts/gate-editor.js"
      defer
    ></script>
  </head>
  <body>
    {{template "header-nav" .}}
    <main>
      <a class="btn secondary" href="/orders/{{.gate.SaleID}}"
        >Вернуться назад</a
      >
      <form action="" method="post">
        <div class="configuration">
          <!--Тип ворот-->
          <label for=""
            >Тип ворот
            <input
              class="input"
              id="gate-type"
              name="gate-type"
              type="text"
              value="{{.gate.GateType.Label}}"
              data-value="{{.gate.GateType}}"
              readonly
            />
          </label>
          <!--Количество-->
          <label for="amount"
            >Количество
            <input
              class="input validator"
              name="amount"
              id="amount"
              type="number"
              min="1"
              placeholder="Значение должно быть не меньше 1"
              title="Значение должно быть не меньше 1"
              value="{{.gate.Amount}}"
              oninput="window.updateGateSizePrice()"
            />
            <p class="validator-hint">Количество должно быть не меньше 1</p>
          </label>
          <div class="sizes">
            <!--Ширина-->
            <label for="width">
              Ширина
              <input
                name="width"
                id="width"
                type="number"
                class="input validator"
                value="{{.gate.Width}}"
                placeholder="Значение должно быть от {{.cfg.WidthParams.MinValue}} до {{.cfg.WidthParams.MaxValue}}"
                title="Значение должно быть от {{.cfg.WidthParams.MinValue}} до {{.cfg.WidthParams.MaxValue}}"
                min="{{.cfg.WidthParams.MinValue}}"
                max="{{.cfg.WidthParams.MaxValue}}"
                oninput="window.updateGateSizePrice()"
              />
              <p class="validator-hint">
                Ширина должна быть от {{.cfg.WidthParams.MinValue}} до
                {{.cfg.WidthParams.MaxValue}}
              </p>
            </label>
            <!--Высота-->
            <label for="height"
              >Высота
              <input
                class="input validator"
                name="height"
                id="height"
                type="number"
                placeholder="Значение должно быть от {{.cfg.HeightParams.MinValue}} до {{.cfg.HeightParams.MaxValue}}"
                title="Значение должно быть от {{.cfg.HeightParams.MinValue}} до {{.cfg.HeightParams.MaxValue}}"
                min="{{.cfg.HeightParams.MinValue}}"
                max="{{.cfg.HeightParams.MaxValue}}"
                value="{{.gate.Height}}"
                oninput="window.updateGateSizePrice()"
              />
              <p class="validator-hint">
                Высота должна быть от {{.cfg.HeightParams.MinValue}} до
                {{.cfg.HeightParams.MaxValue}}
              </p>
            </label>
          </div>
          <!--Высота притолки-->
          <label for="headroom"
            >Высота притолки
            <input
              class="input"
              name="headroom"
              id="headroom"
              type="number"
              min="0"
              value="{{.gate.Headroom}}"
            />
          </label>

          <!--Тип подъема-->
          <label for="lift-type"
            >Тип подъема
            <select
              class="select"
              name="lift-type"
              id="lift-type"
              onchange="window.updateGatePrice()"
            >
              {{range .cfg.LiftTypes}}
              <option
                value="{{.ID}}"
                data-retail-markup="{{.RetailMarkup}}"
                data-wholesale-markup="{{.WholesaleMarkup}}"
                {{if
                eq
                .ID
                $.gate.LiftTypeID}}
                selected
                {{end}}
              >
                {{.Name}}
              </option>
              {{end}}
            </select>
          </label>

          <!--Количество циклов-->
          <label for="cycle-amount"
            >Количество циклов
            <select
              class="select"
              name="cycle-amount"
              id="cycle-amount"
              onchange="window.updateGatePrice()"
            >
              {{range .cfg.CycleAmounts}}
              <option
                value="{{.ID}}"
                data-retail-markup="{{.RetailMarkup}}"
                data-wholesale-markup="{{.WholesaleMarkup}}"
                {{if
                eq
                .ID
                $.gate.CycleAmountID}}selected{{end}}
              >
                {{.Name}}
              </option>
              {{end}}
            </select>
          </label>

          <!--Цвет ворот снаружи-->
          <label for="color-out"
            >Цвет ворот снаружи
            <select class="select" name="color-out" id="color-out">
              {{range .cfg.Colors}}
              <option
                value="{{.ID}}"
                {{if
                eq
                .ID
                $.gate.ColorOutID}}selected{{end}}
              >
                {{.Code}}
              </option>
              {{end}}
            </select>
          </label>

          <!--Привод-->
          <div class="drive-block">
            <!--Тип привода-->
            <label
              >Тип привода
              <select
                name="drive-type"
                class="drive-type select"
                onchange="window.updateDriveType()"
              >
                {{range .cfg.DriveTypes}}
                <option
                  value="{{.}}"
                  {{if
                  eq
                  .
                  $.gate.DriveType}}selected{{end}}
                >
                  {{.Label}}
                </option>
                {{end}}
              </select>
            </label>
            <label
              >Длина цепи
              <input
                oninput="window.updateGatePrice()"
                data-chain-drive-retail-price="14500"
                data-chain-drive-wholesale-price="10200"
                data-chain-retail-price="540"
                data-chain-wholesale-price="450"
                id="chain-length"
                name="chain-length"
                class="chain-length input"
                type="number"
                min="0"
                {{if
                eq
                .gate.DriveType
                `manual`}}
                value="{{.manualDrive.ChainLength}}"
                {{else}}
                value="0"
                {{end}}
              />
            </label>

            <div class="drive-auto">
              {{if eq .gate.GateType "ind"}}
              <label for="drive"
                >Привод промышленный
                <select class="select" name="drive" id="drive">
                  {{range .cfg.IndustrialDrives}}
                  <option
                    value="{{.ID}}"
                    data-retail-price="{{.RetailPrice}}"
                    data-wholesale-price="{{.WholesalePrice}}"
                    {{if
                    ne
                    $.gate.DriveType
                    `manual`}}
                    {{if
                    eq
                    .ID
                    $.industrialDrive.DriveID}}selected{{end}}
                    {{end}}
                  >
                    {{.Name}}
                  </option>
                  {{end}}
                </select>
              </label>
              {{else}}
              <label for="drive"
                >Привод бытовой
                <select class="select" name="drive" id="drive">
                  {{range .cfg.ResidentialDrives}}
                  <option
                    value="{{.ID}}"
                    data-retail-price="{{.RetailPrice}}"
                    data-wholesale-price="{{.WholesalePrice}}"
                    {{if
                    ne
                    $.gate.DriveType
                    `manual`}}
                    {{if
                    eq
                    .ID
                    $.residentialDrive.DriveID}}selected{{end}}
                    {{end}}
                  >
                    {{.Name}}
                  </option>
                  {{end}}
                </select>
              </label>
              {{end}}
              <label for="rail"
                >Направляющая
                <select class="select" name="rail" id="rail">
                  {{range .cfg.Rails}}
                  <option
                    value="{{.ID}}"
                    data-retail-price="{{.RetailPrice}}"
                    data-wholesale-price="{{.WholesalePrice}}"
                    {{if
                    ne
                    $.gate.DriveType
                    `manual`}}
                    {{if
                    eq
                    .ID
                    $.residentialDrive.RailID}}selected{{end}}
                    {{end}}
                  >
                    {{.Name}}
                  </option>
                  {{end}}
                </select></label
              >
            </div>
          </div>
        </div>
        <div class="options">
          <ul
            class="option-list"
            data-retail-price="0"
            data-wholesale-price="0"
          >
            {{range .options}}
            <li class="option-item">
              <select
                name="option"
                class="option select"
                onchange="window.updateOptionsPrice(this)"
              >
                <option
                  value="{{.Option.ID}}"
                  data-retail-price="{{.Option.RetailPrice}}"
                  data-wholesale-price="{{.Option.WholesalePrice}}"
                >
                  {{.Option.Name}}
                </option>
              </select>
              <div class="controls">
                <input
                  type="number"
                  name="amount"
                  class="amount input"
                  min="1"
                  value="1"
                  oninput="window.updateOptionsPrice(this)"
                />
                <button
                  type="button"
                  class="btn secondary"
                  onclick="
                    removeItem(this, '.option-div');
                    window.updateOptionsPrice(this);
                  "
                >
                  Удалить
                </button>
              </div>
            </li>
            {{else}}
            <li>
              <p>Нет доступных опций</p>
            </li>
            {{end}}
          </ul>
        </div>
      </form>
      <footer class="footer footer-horizontal calc-footer dark">
        <div>
          <div class="price-row">
            <p>Цена текущих ворот (дилер):</p>
            <p id="gate-wholesale-price">0</p>
          </div>
          <div class="price-row">
            <p>Цена текущих ворот (клиент):</p>
            <p id="gate-retail-price">0</p>
          </div>
        </div>
        <div>
          <button
            class="btn primary"
            type="button"
            onclick="window.SaveGateConfiguration()"
          >
            Сохранить
          </button>
        </div>
      </footer>
    </main>
    <script src="/web/assets/scripts/protobuf.min.js"></script>
  </body>
</html>
