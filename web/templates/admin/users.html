<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/web/assets/styles/library/index.css" />
    <link rel="icon" href="/web/assets/images/favicon.ico" />
    {{if .css}}
    <link rel="stylesheet" href="/web/assets/styles/pages/{{.css}}" />
    {{end}}
    <title>Пользователи</title>
  </head>
  <body>
    {{template "header-nav" .}}
    <main>
      <div class="form-container">
        <h1>Пользователи</h1>
        <div>
          <a href="/tables" class="btn secondary">Вернуться назад</a>
          <button
            class="btn secondary"
            onclick="document.getElementById('add-modal').showModal()"
          >
            Добавить
          </button>
        </div>
        <table class="table">
          <tr>
            <th>ID</th>
            <th>ФИО</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>Роль</th>
            <th></th>
            <th></th>
          </tr>
          {{range .tableData}}
          <tr
            class="table-row"
            data-id="{{.ID}}"
            data-fullname="{{.Fullname}}"
            data-email="{{.Email}}"
            data-phone="{{.PhoneNumber}}"
            data-role="{{.Role}}"
          >
            <td>{{.ID}}</td>
            <td>{{.Fullname}}</td>
            <td>{{.Email}}</td>
            <td>{{.PhoneNumber}}</td>
            <td>{{.Role.Label}}</td>
            <td>
              <button
                class="btn secondary"
                onclick="openUpdateModal(`users`, this)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
                  />
                  <path d="m15 5 4 4" />
                </svg>
              </button>
            </td>
            <td>
              <button
                class="btn secondary"
                onclick="deleteRow({{.ID}}, `users`)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                  <path d="M3 6h18" />
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
              </button>
            </td>
          </tr>
          {{else}}
          <tr>
            <td colspan="7">Нет ни одного пользователя</td>
          </tr>
          {{end}}
        </table>
      </div>
    </main>

    <dialog id="add-modal" class="modal">
      <div class="modal-box">
        <form method="post" action="/tables/users">
          <div>
            <label
              >ФИО
              <input class="input" type="text" name="fullname" required />
            </label>
          </div>
          <div>
            <label
              >Email
              <input class="input" type="email" name="email" />
            </label>
          </div>
          <div>
            <label
              >Телефон
              <input class="input" type="tel" name="phone" required />
            </label>
          </div>
          <div>
            <label
              >Пароль
              <input class="input" type="password" name="password" required />
            </label>
          </div>
          <div>
            <label
              >Роль
              <select class="select" name="role" required>
                {{range .roles}}
                <option value="{{.}}">{{.Label}}</option>
                {{end}}
              </select>
            </label>
          </div>
          <button class="btn primary" type="submit">Создать</button>
        </form>
      </div>
    </dialog>

    <dialog id="edit-modal" class="modal">
      <div class="modal-box">
        <form
          id="edit-form"
          data-url="/tables/users"
          onsubmit="updateRow(event)"
        >
          <div>
            <label
              >ID
              <input class="input id" type="text" name="id" readonly required />
            </label>
          </div>
          <div>
            <label
              >ФИО
              <input
                class="input fullname"
                type="text"
                name="fullname"
                required
              />
            </label>
          </div>
          <div>
            <label
              >Email
              <input class="input email" type="email" name="email" />
            </label>
          </div>
          <div>
            <label
              >Телефон
              <input class="input phone" type="tel" name="phone" required />
            </label>
          </div>
          <div>
            <label
              >Новый пароль <small>(оставьте пустым, чтобы не менять)</small>
              <input class="input password" type="password" name="password" />
            </label>
          </div>
          <div>
            <label
              >Роль
              <select class="select role" name="role" required>
                {{range .roles}}
                <option value="{{.}}">{{.Label}}</option>
                {{end}}
              </select>
            </label>
          </div>
          <button class="btn primary" type="submit">Сохранить</button>
        </form>
      </div>
    </dialog>

    {{template "footer" .}}
    <script src="/web/assets/scripts/admin.js"></script>
    <script src="/web/assets/scripts/sweetalert2.all.min.js"></script>
  </body>
</html>
