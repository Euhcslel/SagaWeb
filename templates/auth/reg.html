{{template "html-start" .}}
<h1>Регистрация</h1>
<div>
  <div class="client">
    <h2>Как клиент</h2>
    <form action="/reg" method="post">
      <input type="hidden" name="accountType" value="client" />
      <label for="username">ФИО</label><br />
      <input type="text" name="username" />
      <label for="fullname">ФИО</label><br />
      <input type="text" name="fullname" />
      <label for="phone">Номер телефона</label><br />
      <input type="tel" name="phone" />
      <label for="email">Почта</label><br />
      <input type="email" name="email" />
      <label for="password">Пароль</label><br />
      <input type="password" name="password" />
      <div style="display: flex; align-items: center">
        <input type="checkbox" required />
        <p>Согласие на обработку данных</p>
      </div>
      <button type="submit" class="primary-button">Зарегистрироваться</button>
    </form>
  </div>
  <div class="dealer">
    <h2>Как дилер</h2>
    <form action="/reg" method="post">
      <input type="hidden" name="accountType" value="dealer" />
      <label for="fullname">ФИО</label><br />
      <input type="text" name="fullname" />
      <label for="company">Название компании</label><br />
      <input type="text" name="company" />
      <label for="phone">Номер телефона</label><br />
      <input type="tel" name="phone" />
      <label for="email">Почта</label><br />
      <input type="email" name="email" />
      <div style="display: flex; align-items: center">
        <input type="checkbox" required />
        <p>Согласие на обработку данных</p>
      </div>
      <button type="submit" class="primary-button">Отправить заявку</button>
    </form>
  </div>
</div>
{{template "html-end"}}
