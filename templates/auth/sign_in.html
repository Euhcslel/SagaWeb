{{template "html-start" .}}
<h1>Авторизация</h1>
<form action="/sign_in" method="post">
    <label for="username">Имя пользователя</label>
    <input type="text" name="username">
    <label for="password">Пароль</label>
    <input type="text" name="password">
    <button type="submit">Войти</button>
</form>
{{template "html-end"}}
