{{template "html-start" .}}
<h1>Дилеры пользователя {{.user.Username}}</h1>
<ul>
  {{range .dealers}}
  <li>{{.Dealer.Username}}</li>
  <li>{{.Dealer.Fullname}}</li>
  <li>{{.Dealer.Email}}</li>
  <li>{{.Dealer.PhoneNumber}}</li>
  {{else}}
  <h2>У данного менеджера отсутствуют дилеры</h2>
  {{end}}
</ul>
{{template "html-end"}}
