{{template "html-start" .}}
<a class="back-button" href="/orders/{{.gate.SaleID}}">Вернуться назад</a>
<form action="">
  <div class="config">
    <!--Тип ворот-->
    <p>Тип ворот: {{.gate.GateType.Name}}</p>
    <!--Тип подъема-->
    <label for="liftType">Тип подъема</label>
    <!--Цвет снаружи-->
    <!--Количество циклов-->
  </div>
  <div class="options">
    <ul>
      {{range .options}}
      <li>{{.Option.Name}} x {{.Amount}}</li>
      {{end}}
    </ul>
  </div>
</form>
<p class="totalPrice">Полная стоимость: {{.gate.TotalPrice}}</p>
{{template "html-end"}}
