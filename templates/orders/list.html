{{template "html-start" .}}
<div class="table-container">
  <h1>Все заказы пользователя</h1>
  <hr class="gradient-line" />
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>№ Заказа</th>
          <th>Заказчик</th>
          <th>Менеджер</th>
          <th>Дата заказа</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody>
        {{range .orders}}
        <tr
          onclick="window.location='/orders/{{.ID}}'"
          class="
              {{if eq .Status "new"}}status-new{{end}}
              {{if eq .Status "pending"}}status-pending{{end}}
              {{if eq .Status "paid"}}status-success{{end}}
              {{if eq .Status "cancelled"}}status-cancelled{{end}}
            "
        >
          <td><p>Заказ #{{.ID}}</p></td>
          <td><p>{{.Client.Fullname}}</p></td>
          <td>
            {{if .Manager}}
            <p>{{.Manager.Fullname}}</p>
            {{else}}
            <p>Нет</p>
            {{end}}
          </td>
          <td>{{fmtTime .CreatedAt}}</td>
          <td>{{.Status.Label}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{template "html-end"}}
