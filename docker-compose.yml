services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: goose up
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy

  size_import:
    build: .
    command: ./size_import
    env_file: .env.docker
    volumes:
      - ./.env.docker:/app/.env:ro
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    volumes:
      - ./.env.docker:/app/.env:ro
      - ./data:/app/data
      - app_logs:/app/logs
    depends_on:
      size_import:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
