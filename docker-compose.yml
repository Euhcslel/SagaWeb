services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: goose up
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./.env.docker:/app/.env:ro
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
  app_logs:
